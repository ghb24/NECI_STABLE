# Common environment variables for NECI CICD workflows
DOC_PATH: /AltestCICD/neci-build/documentation
BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
BUILD_ROOT: /AltestCICD/neci-build
BUILD_IDENTIFIER: >-
  ${{ 
    github.event_name == 'pull_request' 
    && format(
        'PR{0}_{1}', 
        github.event.pull_request.number, 
        env.BRANCH_NAME
      ) 
    || env.BRANCH_NAME 
  }}