name: 'Build NECI'
description: 'Build NECI with specified MPI implementation'
inputs:
  mpi-impl:
    description: 'MPI implementation (ompi3, ompi5, or impi21)'
    required: true
  build-type:
    description: 'Build type'
    required: true
  additional-option:
    description: 'Additional build option'
    required: true
  build-root:
    description: 'Build root directory'
    required: true
  build-identifier:
    description: 'Build identifier'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Check directory permissions
      shell: bash
      run: |
        echo "=== DIRECTORY PERMISSIONS DIAGNOSTICS ==="
        echo "Build root directory:"
        ls -la ${{ inputs.build-root }}
        echo ""
        echo "Build identifier directory (if exists):"
        ls -la ${{ inputs.build-root }}/build_${{ inputs.build-identifier }}/ 2>/dev/null || echo "Directory does not exist yet"
        echo ""
        echo "Current user info:"
        id
        echo "User 1001 info (Docker user):"
        id 1001 2>/dev/null || echo "User 1001 does not exist on host"
        echo ""
        echo "Ownership of build root:"
        stat -c "%U:%G (%u:%g)" ${{ inputs.build-root }}
        echo "============================================"
        
    - name: Build in Docker
      shell: bash
      run: |
        docker run --rm \
          --userns=host \
          --user 0:0 \
          --shm-size=4g \
          -v ${{ github.workspace }}:/workspace:ro \
          -v ${{ inputs.build-root }}:/build \
          -w /build \
          neci_base.${{ inputs.mpi-impl }}:latest \
          bash -c "
            set -euo pipefail
            
            # Deep dive diagnostics - WHY can't Docker create directories?
            echo '=== DOCKER CONTAINER DIAGNOSTICS ==='
            echo 'Container user info:'
            id
            echo 'Container whoami: '$(whoami 2>/dev/null || echo 'whoami failed')
            echo 'Container UID: '$(id -u)
            echo 'Container GID: '$(id -g)
            echo ''
            echo 'Mount point permissions:'
            ls -la /build
            echo ''
            echo 'Build identifier directory:'
            ls -la /build/build_${{ inputs.build-identifier }}/ 2>/dev/null || echo 'Build identifier directory does not exist'
            echo ''
            echo 'Test write permissions:'
            echo 'Can we write to /build?'
            touch /build/test_write_root 2>/dev/null && echo 'YES - can write to /build root' || echo 'NO - cannot write to /build root'
            echo 'Can we write to build identifier dir?'
            touch /build/build_${{ inputs.build-identifier }}/test_write_subdir 2>/dev/null && echo 'YES - can write to build identifier dir' || echo 'NO - cannot write to build identifier dir'
            echo ''
            echo 'Trying to create the problematic directory manually:'
            mkdir -p /build/build_${{ inputs.build-identifier }}/${{ inputs.mpi-impl }}_${{ inputs.build-type }}_${{ inputs.additional-option }} 2>&1 || echo 'mkdir failed as expected'
            echo ''
            echo 'Filesystem info:'
            df -h /build
            echo 'Mount info:'
            mount | grep build || echo 'No build mount found'
            echo '======================================='
            
            # Build NECI
            mkdir -p build_${{ inputs.build-identifier }}/${{ inputs.mpi-impl }}_${{ inputs.build-type }}_${{ inputs.additional-option }}
            cd build_${{ inputs.build-identifier }}/${{ inputs.mpi-impl }}_${{ inputs.build-type }}_${{ inputs.additional-option }}

            # Set compiler commands based on MPI implementation
            if [[ '${{ inputs.mpi-impl }}' == 'impi21' ]]; then
              COMPILER_CMAKE_ARGS='-DCMAKE_Fortran_COMPILER=mpiifort -DCMAKE_C_COMPILER=mpiicc -DCMAKE_CXX_COMPILER=mpiicpc'
            else
              COMPILER_CMAKE_ARGS='-DCMAKE_Fortran_COMPILER=mpifort -DCMAKE_C_COMPILER=mpicc -DCMAKE_CXX_COMPILER=mpicxx'
            fi

            if [[ '${{ inputs.additional-option }}' == 'default' ]]; then
              ADDITIONAL_CMAKE_ARGS='-DENABLE_HDF5=ON'
            elif [[ '${{ inputs.additional-option }}' == 'nohdf5' ]]; then
              ADDITIONAL_CMAKE_ARGS='-DENABLE_HDF5=OFF'
            elif [[ '${{ inputs.additional-option }}' == 'self-build-hdf5' ]]; then
              ADDITIONAL_CMAKE_ARGS='-DENABLE_HDF5=ON -DENABLE_BUILD_HDF5=ON'
            elif [[ '${{ inputs.additional-option }}' == 'int8' ]]; then
              ADDITIONAL_CMAKE_ARGS='-DENABLE_HDF5=ON -DCMAKE_Fortran_FLAGS=\"-fdefault-integer-8\"'
            fi

            cmake -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} \$ADDITIONAL_CMAKE_ARGS \$COMPILER_CMAKE_ARGS /workspace
            cmake --build . --target all -j 4 --verbose
          "
