name: 'Build NECI'
description: 'Build NECI with specified MPI implementation'
inputs:
  mpi-impl:
    description: 'MPI implementation (ompi3, ompi5, or impi21)'
    required: true
  build-type:
    description: 'Build type'
    required: true
  additional-option:
    description: 'Additional build option'
    required: true
  build-root:
    description: 'Build root directory'
    required: true
  build-identifier:
    description: 'Build identifier'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Build in Docker
      shell: bash
      run: |
        docker run --rm \
          --user 1001:100 \
          --shm-size=4g \
          -v ${{ github.workspace }}:/workspace:ro \
          -v ${{ inputs.build-root }}:/build \
          -w /build \
          neci_base.${{ inputs.mpi-impl }}:latest \
          bash -c "
            set -euo pipefail
            
            # Build NECI
            mkdir -p build_${{ inputs.build-identifier }}/${{ inputs.mpi-impl }}_${{ inputs.build-type }}_${{ inputs.additional-option }}
            cd build_${{ inputs.build-identifier }}/${{ inputs.mpi-impl }}_${{ inputs.build-type }}_${{ inputs.additional-option }}

            # Set compiler commands based on MPI implementation
            if [[ '${{ inputs.mpi-impl }}' == 'impi21' ]]; then
              COMPILER_CMAKE_ARGS='-DCMAKE_Fortran_COMPILER=mpiifort -DCMAKE_C_COMPILER=mpiicc -DCMAKE_CXX_COMPILER=mpiicpc'
            else
              COMPILER_CMAKE_ARGS='-DCMAKE_Fortran_COMPILER=mpifort -DCMAKE_C_COMPILER=mpicc -DCMAKE_CXX_COMPILER=mpicxx'
            fi

            if [[ '${{ inputs.additional-option }}' == 'default' ]]; then
              ADDITIONAL_CMAKE_ARGS='-DENABLE_HDF5=ON'
            elif [[ '${{ inputs.additional-option }}' == 'nohdf5' ]]; then
              ADDITIONAL_CMAKE_ARGS='-DENABLE_HDF5=OFF'
            elif [[ '${{ inputs.additional-option }}' == 'self-build-hdf5' ]]; then
              ADDITIONAL_CMAKE_ARGS='-DENABLE_HDF5=ON -DENABLE_BUILD_HDF5=ON'
            elif [[ '${{ inputs.additional-option }}' == 'int8' ]]; then
              ADDITIONAL_CMAKE_ARGS='-DENABLE_HDF5=ON -DCMAKE_Fortran_FLAGS=\"-fdefault-integer-8\"'
            fi

            cmake -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} \$ADDITIONAL_CMAKE_ARGS \$COMPILER_CMAKE_ARGS /workspace
            cmake --build . --target all -j 4 --verbose
          "
