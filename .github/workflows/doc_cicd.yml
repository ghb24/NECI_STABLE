name: build and deploy documentation

on:
  push:
    branches: [ "master", "stable", "devel" ]
  pull_request:
    branches: [ "master", "stable", "devel" ]

env:
  DOC_PATH: /AltestCICD/neci-build/documentation
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  BUILD_ROOT: /AltestCICD/neci-build
  BUILD_IDENTIFIER: ${{ github.event_name == 'pull_request' && format('PR{0}_RUN{1}', github.event.pull_request.number, github.run_number) || format('{0}_RUN{1}', github.ref_name, github.run_number) }}

jobs:
  build:
    timeout-minutes: 60
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.BUILD_ROOT }}

    strategy:
      matrix:
        BUILD_TYPE: [
          "gfort7-doc",
        ]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          /AltestCICD/.cache/neci-cache/${{ matrix.BUILD_TYPE }}/deps
        key: ${{ runner.os }}-${{ matrix.BUILD_TYPE }}-${{ hashFiles('**/requirements.txt', '**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.BUILD_TYPE }}-

    - name: Setup cache symlinks
      run: |
        mkdir -p /AltestCICD/.cache/neci-cache/${{ matrix.BUILD_TYPE }}/deps
        mkdir -p build_doc_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}
        ln -sf /AltestCICD/.cache/neci-cache/${{ matrix.BUILD_TYPE }}/deps build_doc_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}/deps

    - name: build doc
      run: |
        mkdir -p build_doc_${{ env.BUILD_IDENTIFIER }}
        cd build_doc_${{ env.BUILD_IDENTIFIER }}
        rm -rf ${{ matrix.BUILD_TYPE }}
        mkdir ${{ matrix.BUILD_TYPE }}
        cd ${{ matrix.BUILD_TYPE }}

        source ${{ github.workspace }}/tools/auto_module.sh "${{ matrix.BUILD_TYPE }}"
        source ${{ github.workspace }}/tools/auto_cmake.sh "${{ matrix.BUILD_TYPE }}" "${{ github.workspace }}"
        source ${{ github.workspace }}/tools/auto_make.sh "${{ matrix.BUILD_TYPE }}"

  deploy:
    needs: build
    timeout-minutes: 30
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.BUILD_ROOT }}/build_doc_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}
    strategy:
      matrix:
        BUILD_TYPE: [
          "gfort7-doc",
        ]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: deploy doc
      run: |
        rm -rf ${{ env.DOC_PATH }}/${{ env.BRANCH_NAME }}
        mkdir -p ${{ env.DOC_PATH }}/${{ env.BRANCH_NAME }}
        mv documentation/html/neci/* ${{ env.DOC_PATH }}/${{ env.BRANCH_NAME }}

#        cp -rp documentation/html/neci/ /home/cicdadmin/doc-test
#        # this uses configurations and ssh-keys in ${JENKINS_HOME}/.ssh/
#        DIR_NAME="${GIT_BRANCH#origin/}"
#        ssh homepage_server "mkdir -p /srv/www/htdocs/alavi/neci/${DIR_NAME}"
#        rsync -av --delete documentation/html/neci/ homepage_server:/srv/www/htdocs/alavi/neci/${DIR_NAME}

  remove_artifacts:
    needs: deploy
    if: always()
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.BUILD_ROOT }}
    steps:
    - name: remove artifacts
      run: |
        echo "Removing build artifacts..."
        rm -rf ${{ env.BUILD_ROOT }}/build_doc_${{ env.BUILD_IDENTIFIER }}
