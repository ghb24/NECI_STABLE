name: build and deploy documentation

on:
  push:
    branches: [ "master", "stable", "devel" ]
  pull_request:
    branches: [ "master", "stable", "devel" ]

env:
  DOC_PATH: /AltestCICD/neci-build/documentation
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  BUILD_ROOT: /AltestCICD/neci-build
  BUILD_IDENTIFIER: ${{ github.event_name == 'pull_request' && format('PR{0}_RUN{1}', github.event.pull_request.number, github.run_number) || format('{0}_RUN{1}', github.ref_name, github.run_number) }}

jobs:
  build:
    timeout-minutes: 60
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.BUILD_ROOT }}

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Build doc
      env:
        BUILD_TYPE: gfort7-doc
      run: |
        docker pull fkfest/ompi3:latest
        docker run --rm \
          -v ${{ github.workspace }}:${{ github.workspace }} \
          -v /AltestCICD:/AltestCICD \
          -w ${{ env.BUILD_ROOT }} \
          neci_base.ompi3:latest \
          bash -c "\
            mkdir -p build_doc_${{ env.BUILD_IDENTIFIER }} && \
            cd build_doc_${{ env.BUILD_IDENTIFIER }} && \
            rm -rf gfort7-doc && \
            mkdir gfort7-doc && \
            cd gfort7-doc && \
            cmake \
              -DENABLE_HDF5=ON \
              -DENABLE_DOC=ON \
              -DSHORT_FORD_COMPILATION=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_Fortran_COMPILER=mpifort \
              -DCMAKE_C_COMPILER=mpicc \
              -DCMAKE_CXX_COMPILER=mpicxx \
              ${{ github.workspace }} && \
            cmake --build . -j 4 --target doc --verbose

  deploy:
    needs: build
    timeout-minutes: 30
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.BUILD_ROOT }}/build_doc_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}

    steps:
    - name: deploy doc
      run: |
        rm -rf ${{ env.DOC_PATH }}/${{ env.BRANCH_NAME }}
        mkdir -p ${{ env.DOC_PATH }}/${{ env.BRANCH_NAME }}
        mv documentation/html/neci/* ${{ env.DOC_PATH }}/${{ env.BRANCH_NAME }}


  remove_artifacts:
    needs: deploy
    if: always()
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.BUILD_ROOT }}
    steps:
    - name: remove artifacts
      run: |
        echo "Removing build artifacts..."
        rm -rf ${{ env.BUILD_ROOT }}/build_doc_${{ env.BUILD_IDENTIFIER }}
