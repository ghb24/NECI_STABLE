name: build and deploy documentation

on:
  push:
    branches: [ "master", "stable", "devel" ]
  pull_request:
    branches: [ "master", "stable", "devel" ]

env:
  BUILD_ROOT: /home/cicdadmin/neci-build
  DOC_PATH: /home/cicdadmin/neci-build/documentation
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    timeout-minutes: 60

    runs-on: self-hosted

    defaults:
        run:
          working-directory: ${{ env.BUILD_ROOT }}

    strategy:
      matrix:
        BUILD_TYPE: [
          "gfort7",
        ]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: build doc
      run: |
        mkdir -p build_doc_${{ github.sha }}
        cd build_doc_${{ github.sha }}
        rm -rf ${{ matrix.BUILD_TYPE }}
        mkdir ${{ matrix.BUILD_TYPE }}
        cd ${{ matrix.BUILD_TYPE }}

        source ${{ github.workspace }}/tools/auto_module.sh "${{ matrix.BUILD_TYPE }}"
        source ${{ github.workspace }}/tools/auto_cmake.sh "${{ matrix.BUILD_TYPE }}" "${{ github.workspace }}"
        source ${{ github.workspace }}/tools/auto_make.sh "${{ matrix.BUILD_TYPE }}"

  deploy:
    needs: build
    timeout-minutes: 30
    runs-on: self-hosted

    defaults:
        run:
          working-directory: ${{ env.BUILD_ROOT }}/build_doc_${{ github.sha }}/${{ matrix.BUILD_TYPE }}

    strategy:
      matrix:
        BUILD_TYPE: [
          "gfort7",
        ]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: deploy doc
      run: |
        rm -rf ${{ env.DOC_PATH }}/${{ env.BRANCH_NAME }}
        mkdir -p ${{ env.DOC_PATH }}/${{ env.BRANCH_NAME }}
        echo ${{ github.workspace }}
        mv ${{ github.workspace }}/documentation/html/neci/* ${{ env.DOC_PATH }}/${{ env.BRANCH_NAME }}

#        cp -rp documentation/html/neci/ /home/cicdadmin/doc-test
#        # this uses configurations and ssh-keys in ${JENKINS_HOME}/.ssh/
#        DIR_NAME="${GIT_BRANCH#origin/}"
#        ssh homepage_server "mkdir -p /srv/www/htdocs/alavi/neci/${DIR_NAME}"
#        rsync -av --delete documentation/html/neci/ homepage_server:/srv/www/htdocs/alavi/neci/${DIR_NAME}

  remove_artifacts:
    needs: deploy
    if: always()
    runs-on: self-hosted

    steps:
    - name: remove artifacts
      run: |
        echo "Removing build artifacts..."
        rm -rf ${{ env.BUILD_ROOT }}/build_doc_${{ github.sha }}
