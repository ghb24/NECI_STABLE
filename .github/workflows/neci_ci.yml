name: build and test

on:
  push:
    branches: [ "master", "stable", "devel" ]
  pull_request:
    branches: [ "master", "stable", "devel" ]

env:
  DOC_PATH: /AltestCICD/neci-build/documentation
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  BUILD_ROOT: /AltestCICD/neci-build
  BUILD_IDENTIFIER: ${{ github.event_name == 'pull_request' && format('PR{0}_{1}', github.event.pull_request.number, github.head_ref || github.ref_name) || github.ref_name }}

jobs:
  # Define matrices in a separate job to avoid repetition
  setup:
    runs-on: self-hosted
    outputs:
      test-matrix: ${{ steps.set-matrix.outputs.test-matrix }}
      unit-test-matrix: ${{ steps.set-matrix.outputs.unit-test-matrix }}
      build-only-matrix: ${{ steps.set-matrix.outputs.build-only-matrix }}
    steps:
      - id: set-matrix
        run: |
          echo "test-matrix=[\"gfort7\",\"gfort7-fastdebug\",\"gfort14-fastdebug\"]" >> $GITHUB_OUTPUT
          echo "unit-test-matrix=[\"gfort7\",\"gfort7-fastdebug\",\"gfort7-debug\",\"gfort14-fastdebug\",\"gfort14-debug\"]" >> $GITHUB_OUTPUT
          echo "build-only-matrix=[\"gfort7-debug-integer8\",\"gfort7-debug-nohdf5\",\"gfort7-self_build_hdf5\",\"gfort14\"]" >> $GITHUB_OUTPUT

  build:
    needs: setup
    timeout-minutes: 60
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.BUILD_ROOT }}
    strategy:
      matrix:
        BUILD_TYPE: ${{ fromJSON(needs.setup.outputs.unit-test-matrix) }}
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          /AltestCICD/.cache/neci-cache/${{ matrix.BUILD_TYPE }}/deps
        key: ${{ runner.os }}-${{ matrix.BUILD_TYPE }}-${{ hashFiles('**/requirements.txt', '**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.BUILD_TYPE }}-

    - name: Setup cache symlinks
      run: |
        mkdir -p /AltestCICD/.cache/neci-cache/${{ matrix.BUILD_TYPE }}/deps
        mkdir -p build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}
        ln -sf /AltestCICD/.cache/neci-cache/${{ matrix.BUILD_TYPE }}/deps build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}/deps

    - name: build all
      run: |
        mkdir -p build_${{ env.BUILD_IDENTIFIER }}
        cd build_${{ env.BUILD_IDENTIFIER }}
        rm -rf ${{ matrix.BUILD_TYPE }}
        mkdir ${{ matrix.BUILD_TYPE }}
        cd ${{ matrix.BUILD_TYPE }}

        source ${{ github.workspace }}/tools/auto_module.sh "${{ matrix.BUILD_TYPE }}"
        source ${{ github.workspace }}/tools/auto_cmake.sh "${{ matrix.BUILD_TYPE }}" "${{ github.workspace }}"
        source ${{ github.workspace }}/tools/auto_make.sh "${{ matrix.BUILD_TYPE }}"

  test_suite:
    needs: [setup, build]
    timeout-minutes: 300
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    strategy:
      matrix:
        BUILD_TYPE: ${{ fromJSON(needs.setup.outputs.test-matrix) }}
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: run test suite
      run: |
        EXE_DIR=${{ env.BUILD_ROOT }}/build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}/bin

        source ${{ github.workspace }}/tools/auto_module.sh "${{ matrix.BUILD_TYPE }}"

        cd test_suite

        /home/cicdadmin/testcode/bin/testcode.py -vvv \
          -e neci="$EXE_DIR/neci" \
          -e mneci="$EXE_DIR/mneci" \
          -e kneci="$EXE_DIR/kneci" \
          -e kmneci="$EXE_DIR/kmneci" \
          -e dneci="$EXE_DIR/dneci"

  unit_test:
    needs: [setup, build]
    timeout-minutes: 60
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.BUILD_ROOT }}
    strategy:
      matrix:
        BUILD_TYPE: ${{ fromJSON(needs.setup.outputs.unit-test-matrix) }}
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: run unit test
      run: |
        source ${{ github.workspace }}/tools/auto_module.sh "${{ matrix.BUILD_TYPE }}"

        cd build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}/unit_tests

        ctest --output-on-failure --tests-regex 'test_(d|k|m|km)?neci_.*' -j 2

  remove_artifacts:
    needs: [test_suite, unit_test]
    if: always()
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.BUILD_ROOT }}
    steps:
    - name: remove artifacts
      run: |
        echo "Removing build artifacts..."
        for build_type in $(echo '${{ needs.setup.outputs.unit-test-matrix }}' | jq -r '.[]'); do
          echo "Removing $build_type build artifacts"
          rm -rf ${{ env.BUILD_ROOT }}/build_${{ env.BUILD_IDENTIFIER }}/$build_type
        done

  # Decouple workflows for build types that don't perform tests
  build-only:
    needs: setup
    timeout-minutes: 60
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.BUILD_ROOT }}
    strategy:
      matrix:
        BUILD_TYPE: ${{ fromJSON(needs.setup.outputs.build-only-matrix) }}
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          /AltestCICD/.cache/neci-cache/${{ matrix.BUILD_TYPE }}/deps
        key: ${{ runner.os }}-${{ matrix.BUILD_TYPE }}-${{ hashFiles('**/requirements.txt', '**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.BUILD_TYPE }}-
    
    - name: Setup cache symlinks
      run: |
        mkdir -p /AltestCICD/.cache/neci-cache/${{ matrix.BUILD_TYPE }}/deps
        mkdir -p build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}
        ln -sf /AltestCICD/.cache/neci-cache/${{ matrix.BUILD_TYPE }}/deps build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}/deps
        
    - name: build all
      run: |
        mkdir -p build_${{ env.BUILD_IDENTIFIER }}
        cd build_${{ env.BUILD_IDENTIFIER }}
        rm -rf ${{ matrix.BUILD_TYPE }}
        mkdir ${{ matrix.BUILD_TYPE }}
        cd ${{ matrix.BUILD_TYPE }}

        source ${{ github.workspace }}/tools/auto_module.sh "${{ matrix.BUILD_TYPE }}"
        source ${{ github.workspace }}/tools/auto_cmake.sh "${{ matrix.BUILD_TYPE }}" "${{ github.workspace }}"
        source ${{ github.workspace }}/tools/auto_make.sh "${{ matrix.BUILD_TYPE }}"

    - name: cleanup build artifacts
      run: |
        cd build_${{ env.BUILD_IDENTIFIER }}
        rm -rf ${{ matrix.BUILD_TYPE }}