name: build and test

on:
  push:
    branches: [ "master", "stable", "devel" ]
  pull_request:
    branches: [ "master", "stable", "devel" ]

env:
  BUILD_ROOT: /AltestCICD/neci-build
  BUILD_IDENTIFIER: ${{ github.event_name == 'pull_request' && format('PR{0}_RUN{1}', github.event.pull_request.number, github.run_number) || format('{0}_RUN{1}', github.ref_name, github.run_number) }}

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 300
    strategy:
      matrix:
        BUILD_TYPE: ["gfort7", "gfort7-debug", "gfort7-fastdebug"]
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        
    - name: Build in Docker
      run: |
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v ${{ github.workspace }}:/workspace:ro \
          -v ${{ env.BUILD_ROOT }}:/build \
          -w /build \
          ghcr.io/fkfest/neci-base-ompi3:latest \
          bash -l -c "
            # Build NECI
            mkdir -p build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}
            cd build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}
            echo $PATH
            echo $LD_LIBRARY_PATH
            which mpifort
            which gfortran
            # source /workspace/tools/auto_module.sh '${{ matrix.BUILD_TYPE }}'
            source /workspace/tools/auto_cmake.sh '${{ matrix.BUILD_TYPE }}' '/workspace'
            source /workspace/tools/auto_make.sh '${{ matrix.BUILD_TYPE }}'
          "

  unit-tests:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 60
    strategy:
      matrix:
        BUILD_TYPE: ["gfort7", "gfort7-debug", "gfort7-fastdebug"]
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Run unit tests in Docker
      run: |
        docker run --rm 
          --user $(id -u):$(id -g) \
          -v ${{ github.workspace }}:/workspace:ro 
          -v ${{ env.BUILD_ROOT }}:/build 
          -w /build 
          ghcr.io/fkfest/neci-base-ompi3:latest 
          bash -l -c "
            # source /workspace/tools/auto_module.sh '${{ matrix.BUILD_TYPE }}'
            cd build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}/unit_tests
            ctest --output-on-failure --tests-regex 'test_(d|k|m|km)?neci_.*' -j 2
          "

  test-suite:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 300
    strategy:
      matrix:
        BUILD_TYPE: ["gfort7", "gfort7-fastdebug"]
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Run test suite in Docker
      run: |
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v ${{ github.workspace }}:/workspace:ro \
          -v ${{ env.BUILD_ROOT }}:/build \
          -v /home/cicdadmin/testcode:/home/cicdadmin/testcode \
          -w /workspace \
          ghcr.io/fkfest/neci-base-ompi3:latest \
          bash -l -c "
            EXE_DIR=/build/build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}/bin

            # source /workspace/tools/auto_module.sh '${{ matrix.BUILD_TYPE }}'
            cd test_suite
            
            /home/cicdadmin/testcode/bin/testcode.py -vvv \
              -e neci=\"\$EXE_DIR/neci\" \
              -e mneci=\"\$EXE_DIR/mneci\" \
              -e kneci=\"\$EXE_DIR/kneci\" \
              -e kmneci=\"\$EXE_DIR/kmneci\" \
              -e dneci=\"\$EXE_DIR/dneci\"
          "

  cleanup:
    needs: [unit-tests, test-suite]
    if: always()
    runs-on: self-hosted
    steps:
    - name: Clean up build artifacts
      run: |
        echo "Cleaning up build artifacts..."
        rm -rf ${{ env.BUILD_ROOT }}/build_${{ env.BUILD_IDENTIFIER }} || true
