name: build and test

on:
  push:
    branches: [ "master", "stable", "devel" ]
  pull_request:
    branches: [ "master", "stable", "devel" ]

env:
  BUILD_ROOT: /AltestCICD/neci-build
  BUILD_IDENTIFIER: ${{ github.event_name == 'pull_request' && format('PR{0}_RUN{1}', github.event.pull_request.number, github.run_number) || format('{0}_RUN{1}', github.ref_name, github.run_number) }}
  IMAGE_NAME: neci_base.ompi3:latest

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 300
    strategy:
      matrix:
        BUILD_TYPE: ["Release", "FastDebug"]
        ADDITIONAL_OPTION: ["default"]
        include:
          # Debug build with additional options
          - BUILD_TYPE: "Debug"
            ADDITIONAL_OPTION: "default"
          - BUILD_TYPE: "Debug"
            ADDITIONAL_OPTION: "nohdf5"
          - BUILD_TYPE: "Debug"
            ADDITIONAL_OPTION: "self-build-hdf5"
          - BUILD_TYPE: "Debug"
            ADDITIONAL_OPTION: "int8"
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        
    - name: Build in Docker
      run: |
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v ${{ github.workspace }}:/workspace:ro \
          -v ${{ env.BUILD_ROOT }}:/build \
          -w /build \
          ${{ env.IMAGE_NAME }} \
          bash -c "
            # Build NECI
            mkdir -p build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}_${{ matrix.ADDITIONAL_OPTION }}
            cd build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}_${{ matrix.ADDITIONAL_OPTION }}

            COMPILER_CMAKE_ARGS='-DCMAKE_Fortran_COMPILER=mpifort -DCMAKE_C_COMPILER=mpicc -DCMAKE_CXX_COMPILER=mpicxx'

            if [[ '${{ matrix.ADDITIONAL_OPTION }}' == 'default' ]]; then
              ADDITIONAL_CMAKE_ARGS='-DENABLE_HDF5=ON'
            elif [[ '${{ matrix.ADDITIONAL_OPTION }}' == 'nohdf5' ]]; then
              ADDITIONAL_CMAKE_ARGS='-DENABLE_HDF5=OFF'
            elif [[ '${{ matrix.ADDITIONAL_OPTION }}' == 'self-build-hdf5' ]]; then
              ADDITIONAL_CMAKE_ARGS='-DENABLE_HDF5=ON -DENABLE_BUILD_HDF5=ON'
            elif [[ '${{ matrix.ADDITIONAL_OPTION }}' == 'int8' ]]; then
              ADDITIONAL_CMAKE_ARGS='-DENABLE_HDF5=ON -DCMAKE_Fortran_FLAGS=\"-fdefault-integer-8\"'
            fi

            cmake -DCMAKE_BUILD_TYPE=${{ matrix.BUILD_TYPE }} \$ADDITIONAL_CMAKE_ARGS \$COMPILER_CMAKE_ARGS /workspace
            cmake --build . --target all -j 4 --verbose
          "

  unit-tests:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 60
    strategy:
      matrix:
        BUILD_TYPE: ["Release", "FastDebug", "Debug"]
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Run unit tests in Docker
      run: |
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v ${{ env.BUILD_ROOT }}:/build \
          -w /build \
          ${{ env.IMAGE_NAME }} \
          bash -c "
            cd build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}_default/unit_tests
            ctest --output-on-failure --tests-regex 'test_(d|k|m|km)?neci_.*' -j 2
          "

  test-suite:
    needs: unit-tests
    runs-on: self-hosted
    timeout-minutes: 300
    strategy:
      matrix:
        BUILD_TYPE: ["Release", "FastDebug"]
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Run test suite in Docker
      run: |
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v ${{ github.workspace }}:/workspace:ro \
          -v ${{ env.BUILD_ROOT }}/build_${{ env.BUILD_IDENTIFIER }}/${{ matrix.BUILD_TYPE }}_default:/workdir \
          -v /home/cicdadmin/testcode:/home/cicdadmin/testcode \
          -w /workdir \
          ${{ env.IMAGE_NAME }} \
          bash -c "
            EXE_DIR=/workdir/bin

            cp -rp /workspace/test_suite .
            cd test_suite

            /home/cicdadmin/testcode/bin/testcode.py -vvv \
              -e neci=\"\$EXE_DIR/neci\" \
              -e mneci=\"\$EXE_DIR/mneci\" \
              -e kneci=\"\$EXE_DIR/kneci\" \
              -e kmneci=\"\$EXE_DIR/kmneci\" \
              -e dneci=\"\$EXE_DIR/dneci\"
          "

  cleanup:
    needs: test-suite
    if: always()
    runs-on: self-hosted
    steps:
    - name: Clean up build artifacts
      run: |
        echo "Cleaning up build artifacts..."
        rm -rf ${{ env.BUILD_ROOT }}/build_${{ env.BUILD_IDENTIFIER }} || true
