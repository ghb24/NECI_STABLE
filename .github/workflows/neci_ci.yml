name: build and test

on:
  push:
    branches: [ "master", "stable", "devel" ]
  pull_request:
    branches: [ "master", "stable", "devel" ]

env:
  BUILD_ROOT: /AltestCICD/neci-build
  BUILD_IDENTIFIER: ${{ github.event_name == 'pull_request' && format('PR{0}_RUN{1}', github.event.pull_request.number, github.run_number) || format('{0}_RUN{1}', github.ref_name, github.run_number) }}

jobs:
  # OpenMPI 3 job thread
  build-ompi3:
    runs-on: self-hosted
    timeout-minutes: 300
    strategy:
      matrix:
        BUILD_TYPE: ["Release", "FastDebug"]
        ADDITIONAL_OPTION: ["default"]
        include:
          # Debug build with additional options
          - BUILD_TYPE: "Debug"
            ADDITIONAL_OPTION: "default"
          - BUILD_TYPE: "Debug"
            ADDITIONAL_OPTION: "nohdf5"
          - BUILD_TYPE: "Debug"
            ADDITIONAL_OPTION: "self-build-hdf5"
          - BUILD_TYPE: "Debug"
            ADDITIONAL_OPTION: "int8"
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Build NECI (OpenMPI 3)
      uses: ./.github/actions/build-neci
      with:
        mpi-impl: ompi3
        build-type: ${{ matrix.BUILD_TYPE }}
        additional-option: ${{ matrix.ADDITIONAL_OPTION }}
        build-root: ${{ env.BUILD_ROOT }}
        build-identifier: ${{ env.BUILD_IDENTIFIER }}

  unit-tests-ompi3:
    needs: build-ompi3
    runs-on: self-hosted
    timeout-minutes: 60
    strategy:
      matrix:
        BUILD_TYPE: ["Release", "FastDebug", "Debug"]
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Run Unit Tests (OpenMPI 3)
      uses: ./.github/actions/run-unit-tests
      with:
        mpi-impl: ompi3
        build-type: ${{ matrix.BUILD_TYPE }}
        build-root: ${{ env.BUILD_ROOT }}
        build-identifier: ${{ env.BUILD_IDENTIFIER }}

  test-suite-ompi3:
    needs: unit-tests-ompi3
    runs-on: self-hosted
    timeout-minutes: 300
    strategy:
      matrix:
        BUILD_TYPE: ["Release", "FastDebug"]
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Run Test Suite (OpenMPI 3)
      uses: ./.github/actions/run-test-suite
      with:
        mpi-impl: ompi3
        build-type: ${{ matrix.BUILD_TYPE }}
        build-root: ${{ env.BUILD_ROOT }}
        build-identifier: ${{ env.BUILD_IDENTIFIER }}

  # OpenMPI 5 job thread
  build-ompi5:
    runs-on: self-hosted
    timeout-minutes: 300
    strategy:
      matrix:
        BUILD_TYPE: ["Release", "FastDebug"]
        ADDITIONAL_OPTION: ["default"]
        include:
          # Debug build with additional options
          - BUILD_TYPE: "Debug"
            ADDITIONAL_OPTION: "default"
          - BUILD_TYPE: "Debug"
            ADDITIONAL_OPTION: "nohdf5"
          - BUILD_TYPE: "Debug"
            ADDITIONAL_OPTION: "self-build-hdf5"
          - BUILD_TYPE: "Debug"
            ADDITIONAL_OPTION: "int8"
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Build NECI (OpenMPI 5)
      uses: ./.github/actions/build-neci
      with:
        mpi-impl: ompi5
        build-type: ${{ matrix.BUILD_TYPE }}
        additional-option: ${{ matrix.ADDITIONAL_OPTION }}
        build-root: ${{ env.BUILD_ROOT }}
        build-identifier: ${{ env.BUILD_IDENTIFIER }}

  unit-tests-ompi5:
    needs: build-ompi5
    runs-on: self-hosted
    timeout-minutes: 60
    strategy:
      matrix:
        BUILD_TYPE: ["Release", "FastDebug", "Debug"]
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Run Unit Tests (OpenMPI 5)
      uses: ./.github/actions/run-unit-tests
      with:
        mpi-impl: ompi5
        build-type: ${{ matrix.BUILD_TYPE }}
        build-root: ${{ env.BUILD_ROOT }}
        build-identifier: ${{ env.BUILD_IDENTIFIER }}

  test-suite-ompi5:
    needs: unit-tests-ompi5
    runs-on: self-hosted
    timeout-minutes: 300
    strategy:
      matrix:
        BUILD_TYPE: ["Release", "FastDebug"]
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Run Test Suite (OpenMPI 5)
      uses: ./.github/actions/run-test-suite
      with:
        mpi-impl: ompi5
        build-type: ${{ matrix.BUILD_TYPE }}
        build-root: ${{ env.BUILD_ROOT }}
        build-identifier: ${{ env.BUILD_IDENTIFIER }}

  cleanup:
    needs: [test-suite-ompi3, test-suite-ompi5]
    if: always()
    runs-on: self-hosted
    steps:
    - name: Clean up build artifacts
      run: |
        echo "Cleaning up build artifacts..."
        rm -rf ${{ env.BUILD_ROOT }}/build_${{ env.BUILD_IDENTIFIER }} || true
